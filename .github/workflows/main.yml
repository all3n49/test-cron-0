
name: CI

on:
  schedule:
    - cron: "2-59/5 * * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install VSCode CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

          wget -qO vscode.deb \
            https://update.code.visualstudio.com/latest/linux-deb-x64/stable

          sudo apt-get install -y ./vscode.deb

      - name: Install Keploy VSCode Extension
        run: |
          code --user-data-dir /tmp/vscode-data \
            --install-extension keploy.keployio

      - name: Verify Installation
        run: |
          code --user-data-dir /tmp/vscode-data \
            --list-extensions

          code --user-data-dir /tmp/vscode-data \
            --list-extensions | grep -Fx "keploy.keployio"
